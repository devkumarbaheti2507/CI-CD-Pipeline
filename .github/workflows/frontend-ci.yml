name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Node.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          REACT_APP_CONTROLLER_URL: ${{ vars.REACT_APP_CONTROLLER_URL || 'http://localhost:9000' }}
          REACT_APP_ANALYZER_URL: ${{ vars.REACT_APP_ANALYZER_URL || 'http://localhost:5001' }}
          REACT_APP_CLASSIFIER_URL: ${{ vars.REACT_APP_CLASSIFIER_URL || 'http://localhost:8000' }}
          REACT_APP_RECOVERY_URL: ${{ vars.REACT_APP_RECOVERY_URL || 'http://localhost:6001' }}
          REACT_APP_NOTIFICATION_URL: ${{ vars.REACT_APP_NOTIFICATION_URL || 'http://localhost:7000' }}
          # Suppress CI=true treating warnings as errors for the course project
          CI: ""
        run: npm run build
