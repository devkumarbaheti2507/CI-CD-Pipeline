name: CI/CD Pipeline Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_blackbox:
        description: "Run black-box integration tests (requires all services)"
        required: false
        default: "false"
        type: boolean

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Backend unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-unit:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/test_whitebox.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          CI: ""
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Black-box integration tests
  # Runs all six microservices + Redis, then fires test_blackbox.py.
  # Triggered automatically on main/master push and on workflow_dispatch
  # when run_blackbox is set to "true".
  # ─────────────────────────────────────────────────────────────────────────────
  integration:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-unit]
    permissions:
      contents: read
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.event.inputs.run_blackbox == 'true'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start all microservices
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          LOG_ANALYZER_URL: http://localhost:5001/api/v1/analyze
          LOG_ANALYZER_HEALTH_URL: http://localhost:5001/api/v1/health
          RECOVERY_SERVICE_URL: http://localhost:6001/recover
          NOTIFICATION_SERVICE_URL: http://localhost:7000/notify
          STATUS_API_KEY: ci-test-key
          ALLOWED_LOG_HOSTS: localhost
        run: |
          # log_analyzer uses Python's built-in http.server (not FastAPI)
          LOG_ANALYZER_PORT=5001 python log_analyzer.py &
          uvicorn failure_classifier:app --host 0.0.0.0 --port 8000 &
          uvicorn recovery_manager:app --host 0.0.0.0 --port 6001 &
          uvicorn notification_service:app --host 0.0.0.0 --port 7000 &
          uvicorn pipeline_controller:app --host 0.0.0.0 --port 9000 &
          echo "Waiting for services to be ready..."
          sleep 8
        shell: bash

      - name: Wait for services to be healthy
        run: |
          for port in 5001 8000 6001 7000 9000; do
            for i in $(seq 1 15); do
              if curl -sf http://localhost:$port/health > /dev/null 2>&1 || \
                 curl -sf http://localhost:$port/api/v1/health > /dev/null 2>&1; then
                echo "Port $port is healthy"
                break
              fi
              echo "Waiting for port $port (attempt $i)..."
              sleep 2
            done
          done

      - name: Run black-box integration tests
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest tests/test_blackbox.py -v --tb=short

      - name: Report pipeline outcome to self (demo)
        if: always()
        run: |
          STATUS=${{ job.status }}
          echo "Pipeline integration job finished with status: $STATUS"
          if [ "$STATUS" = "success" ]; then
            echo "✅ All integration tests passed — no recovery needed"
          else
            echo "❌ Integration tests failed — recovery workflow would trigger here"
          fi
